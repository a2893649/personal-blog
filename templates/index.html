<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>我的博客</title>
  <meta name="description" content="个人博客，记录技术笔记与生活随笔" />
  <link rel="stylesheet" href="/static/css/style.css" />
  <link rel="stylesheet" href="/static/lib/github.min.css" />
</head>
<body>
  <header class="site-header">
    <div class="container">
      <a class="brand" href="#/">
        <span class="logo">🍯</span>
        <span>小蜜的博客</span>
      </a>
      <button class="nav-toggle" id="navToggle" aria-label="菜单">☰</button>
      <nav class="nav-links" id="navLinks">
        <a href="#/" data-route="home">首页</a>
        <a href="#/about" data-route="about">关于</a>
        <a href="/admin" target="_blank">后台</a>
        <span id="authArea"></span>
      </nav>
    </div>
  </header>

  <div class="container">
    <div class="layout">
      <main class="main-col" id="app"><div class="loading">加载中…</div></main>
      <aside class="side-col" id="sidebar"></aside>
    </div>
  </div>

  <footer class="site-footer">
    <div class="container">© <span id="year"></span> 小蜜的博客 · 由 Flask + 原生 JS 强力驱动</div>
  </footer>

  <!-- 登录/注册弹窗 -->
  <div class="modal-mask" id="authModal" style="display:none">
    <div class="modal">
      <button class="modal-close" id="authClose" aria-label="关闭">×</button>
      <div class="tabs" style="margin-bottom:16px">
        <div class="tab active" id="tabLogin">登录</div>
        <div class="tab" id="tabReg">注册</div>
      </div>
      <form id="loginForm" autocomplete="on">
        <div class="field"><label>用户名或邮箱</label><input id="loginIdent" placeholder="用户名 / 邮箱" /></div>
        <div class="field"><label>密码</label><input id="loginPwd" type="password" placeholder="••••••" /></div>
        <button class="btn btn-primary" type="submit" style="width:100%;justify-content:center;margin-top:6px">登 录</button>
        <div class="form-err" id="loginErr"></div>
      </form>
      <form id="regForm" autocomplete="on" style="display:none">
        <div class="field"><label>用户名（至少3位）</label><input id="regUser" placeholder="用户名" /></div>
        <div class="field"><label>邮箱（可选）</label><input id="regEmail" type="email" placeholder="you@example.com" /></div>
        <div class="field"><label>密码（至少6位）</label><input id="regPwd" type="password" placeholder="••••••" /></div>
        <button class="btn btn-primary" type="submit" style="width:100%;justify-content:center;margin-top:6px">注 册</button>
        <div class="form-err" id="regErr"></div>
      </form>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="/static/lib/marked.min.js"></script>
  <script src="/static/lib/purify.min.js"></script>
  <script src="/static/lib/highlight.min.js"></script>
  <script src="/static/js/public.js"></script>
</body>
</html>
