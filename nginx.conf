# ===== Nginx 反向代理示例（VPS 部署）=====
# 作用：由 Nginx 直接托管 /static 静态文件，其余请求转发给 gunicorn(5000)
# 将其放入 /etc/nginx/conf.d/your-domain.conf 或 sites-enabled
# 修改 server_name、root 路径与 SSL 证书路径后执行：nginx -t && systemctl reload nginx

server {
    listen 80;
    # 上线后改为你的域名，并配置下面的 HTTPS
    server_name your-domain.com www.your-domain.com;

    client_max_body_size 8M;

    # 静态资源由 Nginx 直接返回（比交给 Flask 更快）
    location /static {
        alias /var/www/blog/static;
        expires 30d;
        add_header Cache-Control "public";
    }

    # 动态请求（页面 + API）转发给 gunicorn
    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }
}

